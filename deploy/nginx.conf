# ============================================================================
# NEUROBRIDGE 11D - NGINX DOCKER PRODUCTION CONFIGURATION
# Phase 1: Solar | Grid Stability | AECE | ADFI | External API | PWA
# Version: 14.8.1 | Production Ready | Grafana iFrame Fixed
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================================================
    # LOGGING - JSON format for production monitoring
    # ==========================================================================
    
    log_format json escape=json '{'
        '"time":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log json buffer=32k flush=5s;
    
    # ==========================================================================
    # PERFORMANCE TUNING
    # ==========================================================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    
    reset_timedout_connection on;
    server_tokens off;
    
    # ==========================================================================
    # GZIP COMPRESSION
    # ==========================================================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        font/woff
        font/woff2;
    
    # ==========================================================================
    # SECURITY HEADERS - PRODUCTION GRADE
    # ==========================================================================
    
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # ==========================================================================
    # RATE LIMITING ZONES
    # ==========================================================================
    
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=external_limit:10m rate=30r/s;
    
    # ==========================================================================
    # PROXY BUFFER SETTINGS - FIXED FOR PRODUCTION
    # Rule: proxy_busy_buffers_size must be <= proxy_buffer_size
    #       and proxy_buffers must provide enough total space
    # ==========================================================================
    
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    proxy_max_temp_file_size 1024m;
    
    # ==========================================================================
    # UPSTREAM BACKENDS
    # ==========================================================================
    
    upstream api_backend {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }
    
    upstream grafana_backend {
        server grafana:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # ==========================================================================
    # MAIN SERVER BLOCK
    # ==========================================================================
    
    server {
        listen 80;
        listen [::]:80;
        server_name localhost api.neurobridge.ng _;
        
        root /usr/share/nginx/html;
        index index.html;
        
        # ======================================================================
        # HEALTH CHECK ENDPOINTS
        # ======================================================================
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location /grafana/api/health {
            proxy_pass http://grafana_backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }
        
        # ======================================================================
        # API PROXY - NO CACHE
        # ======================================================================
        
        location /api/v1/health {
            proxy_pass http://api_backend/api/v1/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        location /api/docs {
            proxy_pass http://api_backend/api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        location /api/openapi.json {
            proxy_pass http://api_backend/api/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # Auth/token endpoints with stricter rate limiting
        location ~ ^/api/v1/(token|auth)/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # External API endpoints
        location /api/v1/external/ {
            limit_req zone=external_limit burst=60 nodelay;
            limit_req_status 429;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_buffering off;
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # General API
        location /api/ {
            limit_req zone=api_limit burst=150 nodelay;
            limit_req_status 429;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_buffering off;
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # ======================================================================
        # PROMETHEUS METRICS - INTERNAL/PROTECTED
        # ======================================================================
        
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            proxy_pass http://api_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        # ======================================================================
        # WEBSOCKET SUPPORT FOR ENERGY CHANNEL
        # ======================================================================
        
        location /ws/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
        
        # ======================================================================
        # GRAFANA REVERSE PROXY - PRODUCTION IFRAME FIX
        # ======================================================================
        # CRITICAL: Uses Grafana's own sub-path handling.
        # Grafana is configured with:
        #   GF_SERVER_ROOT_URL: http://localhost/grafana/
        #   GF_SERVER_SERVE_FROM_SUB_PATH: "true"
        # So Grafana expects requests at /grafana/ and responds correctly.
        # Nginx passes /grafana/* to Grafana as /grafana/*
        # ======================================================================
        
        # Exact match redirect for /grafana -> /grafana/
        location = /grafana {
            return 302 /grafana/;
        }
        
        location /grafana/ {
            # Pass to Grafana with the /grafana/ prefix intact
            # Grafana handles the sub-path routing internally
            proxy_pass http://grafana_backend/grafana/;
            
            proxy_http_version 1.1;
            
            # Essential headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 80;
            proxy_set_header X-Forwarded-Prefix /grafana;
            
            # WebSocket support for Grafana Live
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Buffering for performance
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 32 8k;
            
            # Timeouts for dashboard loading
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            
            # Cookie path handling
            proxy_cookie_path / /grafana/;
            
            # CRITICAL: Allow iframe embedding
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
            
            # Allow frame-ancestors
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "frame-ancestors 'self';" always;
            
            # Disable redirect rewriting (Grafana handles its own)
            proxy_redirect off;
        }
        
        # ======================================================================
        # PWA STATIC ASSETS - CACHING STRATEGY
        # ======================================================================
        
        location /frontend/ {
            alias /usr/share/nginx/html/;
            expires 1h;
            add_header Cache-Control "public";
        }
        
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 7d;
            add_header Cache-Control "public";
        }
        
        location /css/ {
            alias /usr/share/nginx/html/css/;
            expires 1h;
            add_header Cache-Control "public";
        }
        
        location /pwa/ {
            alias /usr/share/nginx/html/pwa/;
            expires 1h;
            add_header Cache-Control "public";
        }
        
        # ======================================================================
        # PWA MANIFEST & SERVICE WORKER
        # ======================================================================
        
        location = /manifest.json {
            try_files /pwa/manifest.json =404;
            expires 1h;
            add_header Cache-Control "public";
        }
        
        location = /sw.js {
            try_files /pwa/sw.js =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        location = /service-worker.js {
            try_files /pwa/sw.js =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # ======================================================================
        # FAVICON
        # ======================================================================
        
        location = /favicon.ico {
            try_files /assets/icons/icon-144.png /assets/icons/favicon.ico =204;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # ======================================================================
        # DASHBOARD ALIASES - SPA ROUTING
        # ======================================================================
        
        location = /dashboard {
            try_files /index.html =404;
        }
        
        location = /pilot-dashboard {
            try_files /index.html =404;
        }
        
        location = /partner {
            try_files /index.html =404;
        }
        
        # ======================================================================
        # ROOT PWA - SPA FALLBACK ROUTING
        # ======================================================================
        
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # ======================================================================
        # ERROR PAGES - PRODUCTION GRADE
        # ======================================================================
        
        error_page 404 /index.html;
        error_page 500 502 503 504 /errors/50x.html;
        
        location = /errors/50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html/errors;
            try_files /50x.html =500;
        }
        
        # ======================================================================
        # DENY ACCESS TO HIDDEN FILES
        # ======================================================================
        
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}