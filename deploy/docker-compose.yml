services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: neurobridge-api
    restart: unless-stopped
    env_file:
      - .env.production.example
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../exports:/app/exports
      - ../benchmarks/reports:/app/benchmarks/reports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - neurobridge_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  redis:
    image: redis:7.2-alpine
    container_name: neurobridge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neurobridge_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    user: "999:999"

  celery_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: neurobridge-celery-worker
    restart: unless-stopped
    env_file:
      - .env.production.example
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: >
      celery -A backend.core.celery_app.celery worker
      --loglevel=INFO
      --concurrency=2
      --queues=energy,grid,solar,weather,hardware,aece,adfi,monitoring,reports,default
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../benchmarks/reports:/app/benchmarks/reports
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "celery", "-A", "backend.core.celery_app", "inspect", "ping"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - neurobridge_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  celery_beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: neurobridge-celery-beat
    restart: unless-stopped
    env_file:
      - .env.production.example
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: >
      celery -A backend.core.celery_app.celery beat
      --loglevel=INFO
      --schedule=/app/data/celerybeat-schedule
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery beat' || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - neurobridge_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  prometheus:
    image: prom/prometheus:latest
    container_name: neurobridge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
    networks:
      - neurobridge_net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ============================================================
  # GRAFANA SERVICE - PRODUCTION IFRAME EMBED CONFIGURATION
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: neurobridge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Admin credentials
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      
      # CRITICAL: Domain and root URL for sub-path reverse proxy
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      
      # CRITICAL: Allow iframe embedding (SAMEORIGIN via nginx proxy)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      
      # Anonymous access for embedded dashboards
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "true"
      
      # Cookie settings for sub-path
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      
      # Disable enforce domain to allow proxy
      GF_SERVER_ENFORCE_DOMAIN: "false"
      GF_SERVER_ROUTER_LOGGING: "false"
      
      # Allow HTML in panels
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      
      # Disable analytics
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      
      # Logging
      GF_LOG_MODE: "console"
      GF_LOG_LEVEL: "warn"
      GF_LOG_FILTERS: "render:info,alerting.notifier:info"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./nginx/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./nginx/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./nginx/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - neurobridge_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # ============================================================
  # NGINX SERVICE - PRODUCTION FIX (NO read_only, NO user override)
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: neurobridge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - neurobridge_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  neurobridge_net:
    driver: bridge
    name: neurobridge_net